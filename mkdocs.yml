site_name: dot-pi
site_description: Custom pi agent configs as dotfiles
site_url: https://PlebeiusGaragicus.github.io/dot-pi/
repo_url: https://github.com/PlebeiusGaragicus/dot-pi
repo_name: dot-pi

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: install.md
  - Usage Guide: usage.md
  - Architecture: architecture.md
  - Agent Layout: agent-layout.md
  - Standalone Agents: standalone-agents.md
  - Multi-Agent Systems:
    - Recon: multi-agent-systems/recon.md
    - Impl: multi-agent-systems/impl.md
    - Blog: multi-agent-systems/blog.md
    - Deep Research: multi-agent-systems/deepresearch.md
    - Reader: multi-agent-systems/reader.md
    - Retro: multi-agent-systems/retro.md
  - Reference:
    - Writing Extensions: reference/extensions.md
    - Model Defaults: reference/model-defaults.md
    - Subagent Concurrency: reference/subagent-concurrency.md
    - Multi-Agent Systems: reference/multi-agent-systems.md
    - Continuous Integration: ci.md
