name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck (bash linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shellcheck \
            --shell=bash \
            --severity=warning \
            --external-sources \
            dotpi \
            install \
            dispatch-agent \
            core/commands/*.sh \
            core/install/*.sh

  typecheck:
    name: typecheck (extensions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: core/tests
      - run: npx tsc --noEmit
        working-directory: core/tests

  smoke:
    name: smoke tests (entry scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dotpi --version
        run: ./dotpi --version
      - name: dotpi --help (parse only; usage() exits 1 by design)
        run: |
          set +e
          ./dotpi --help
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "Unexpected exit code: $rc (expected 0 or 1)"
            exit 1
          fi
      - name: install --help
        run: bash install --help
      - name: pi-args parsing (no trailing newline, comments, multi-word flags)
        run: |
          set -e
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          # pi-args with comments, blank line, multi-word flag, and NO trailing newline
          printf '# comment line\n\n--tools\nread,grep\n--no-skills' > "$tmp/pi-args"

          # Run the same parsing loop dispatch-agent uses
          _pi_args=()
          while IFS= read -r _line || [ -n "$_line" ]; do
            [[ -n "$_line" && "$_line" != \#* ]] && _pi_args+=($_line)
          done < "$tmp/pi-args"

          actual="${_pi_args[*]}"
          for expected in "--tools" "read,grep" "--no-skills"; do
            if ! printf '%s\n' "$actual" | grep -qF -- "$expected"; then
              echo "FAIL: expected '$expected' in: $actual"
              exit 1
            fi
          done

          # Verify comment and blank line were skipped (should be exactly 3 elements)
          if [ "${#_pi_args[@]}" -ne 3 ]; then
            echo "FAIL: expected 3 elements, got ${#_pi_args[@]}: $actual"
            exit 1
          fi
          echo "PASS: pi-args parsed correctly (${#_pi_args[@]} elements): $actual"
      - name: bash syntax check (all shell scripts)
        run: |
          bash -n dotpi
          bash -n install
          bash -n dispatch-agent
          for f in core/commands/*.sh; do bash -n "$f"; done
          for f in core/dispatch/*.sh; do bash -n "$f"; done
          for f in core/install/*.sh; do bash -n "$f"; done
      - name: postinstall smoke
        run: bash core/tests/postinstall-smoke.sh
      - name: path-rc smoke
        run: bash core/tests/path-rc-smoke.sh

  gitignore-guard:
    name: gitignore vs tracked guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no gitignored file is also tracked
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Double-check with git check-ignore which respects ! negations
            if git check-ignore -q "$f" 2>/dev/null; then
              echo "ERROR: $f is tracked but gitignored"
              fail=1
            fi
          done < <(git ls-files -ci --exclude-standard)
          exit "$fail"

  docs:
    name: mkdocs --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install mkdocs-material
        run: pip install mkdocs-material
      - name: Build docs (strict)
        run: mkdocs build --strict
